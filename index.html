<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TAO le louveteau</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #f9f9f9;
    }
    img {
      width: 250px;
    }
    button {
      font-size: 1.2em;
      padding: 10px 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>TAO le louveteau</h1>
  <img src="TAO%20transparent.png" alt="TAO le louveteau">
  <br>
  <button onclick="parler()">Fais parler TAO</button>

  <script>
    function parler() {
      const synth = window.speechSynthesis;
      const voix = new SpeechSynthesisUtterance("Bonjour, je suis TAO, ton compagnon virtuel !");
      voix.lang = "fr-FR";
      synth.speak(voix);
    }
  </script>
</body>
</html>
